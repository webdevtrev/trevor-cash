<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trevor Cash | Photos</title>
    <link
      rel="preload"
      href="../assets/Hubot-Sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="../Components/header.js"></script>
    <script type="module" src="../Components/footer.js"></script>
    <script type="module" src="../Components/photo-lightbox.js"></script>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-15G72Q4KRZ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-15G72Q4KRZ');
    </script>
  </head>
  <body>
    <custom-header page="Photos"></custom-header>
    <main>
      <section class="Photos-Hero Hero">
        <div class="Hero-Head">
          <h1>Photos</h1>
          <p class="Hero-Lede">
            Friends, trips and everyday light, mostly shot on film. Hover a
            frame for where and when, or open one to see it full size.
          </p>
        </div>
        <div class="Strip" id="strip" hidden>
          <div class="Strip-Track" id="strip-track"></div>
        </div>
      </section>

      <section class="Index" aria-labelledby="index-heading">
        <div class="Section-Meta">
          <h2 id="index-heading" class="Index-Title">Index</h2>
          <p id="count" aria-live="polite"></p>
          <div class="Density" role="group" aria-label="Thumbnail size" hidden>
            <button type="button" data-density="S" aria-label="Small thumbnails">S</button>
            <button type="button" data-density="M" aria-label="Medium thumbnails">M</button>
            <button type="button" data-density="L" aria-label="Large thumbnails">L</button>
          </div>
        </div>
        <div class="Status" id="status" role="status" hidden></div>
        <div class="Grid" id="grid" data-density="M" aria-busy="true"></div>
      </section>
    </main>
    <photo-lightbox id="lightbox"></photo-lightbox>
    <custom-footer></custom-footer>
  </body>
  <script type="module" src="./app.js"></script>
</html>
